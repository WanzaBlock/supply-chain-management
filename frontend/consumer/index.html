<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Verify — Supply Chain</title>
  <link rel="stylesheet" href="../shared/style.css">
  <!-- html5-qrcode library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { background: var(--light-gray); }
    .consumer-wrap {
      max-width: 540px;
      margin:    0 auto;
      padding:   24px 16px;
    }
    .consumer-header {
      text-align:    center;
      margin-bottom: 24px;
    }
    .consumer-header h1 { color: var(--blue); font-size: 22px; }
    .consumer-header p  { color: var(--gray); font-size: 14px; margin-top: 4px; }

    .scan-box {
      background:    var(--white);
      border-radius: var(--radius);
      box-shadow:    var(--shadow);
      padding:       20px;
      margin-bottom: 20px;
      text-align:    center;
    }
    .scan-box h2 { font-size: 16px; color: var(--blue); margin-bottom: 14px; }

    .manual-lookup {
      display:    flex;
      gap:        8px;
      margin-top: 14px;
    }
    .manual-lookup input {
      flex:          1;
      padding:       8px 12px;
      border:        1px solid #D1D5DB;
      border-radius: var(--radius);
      font-size:     14px;
    }

    #reader { width: 100%; max-width: 300px; margin: 0 auto; }

    .product-card {
      background:    var(--white);
      border-radius: var(--radius);
      box-shadow:    var(--shadow);
      overflow:      hidden;
      margin-bottom: 20px;
    }
    .product-card-header {
      background: var(--blue);
      color:      var(--white);
      padding:    16px 20px;
      display:    flex;
      align-items: center;
      gap:        12px;
    }
    .product-card-header .auth-icon {
      font-size: 28px;
    }
    .product-card-header h3 { font-size: 18px; }
    .product-card-header p  { font-size: 13px; color: var(--accent-blue); margin-top: 2px; }

    .product-meta {
      padding:               16px 20px;
      display:               grid;
      grid-template-columns: 1fr 1fr;
      gap:                   10px 20px;
      border-bottom:         1px solid var(--light-blue);
    }
    .meta-item label { font-size: 12px; color: var(--gray); display: block; }
    .meta-item span  { font-size: 14px; color: var(--dark-gray); font-weight: 500; }

    .history-section { padding: 16px 20px; }
    .history-section h4 { font-size: 14px; font-weight: 600; color: var(--blue); margin-bottom: 14px; }

    .genuine-banner {
      background:    #D1FAE5;
      border:        1px solid #6EE7B7;
      border-radius: var(--radius);
      padding:       12px 16px;
      display:       flex;
      align-items:   center;
      gap:           10px;
      margin:        0 20px 16px;
      color:         #065F46;
      font-size:     14px;
      font-weight:   500;
    }
    .counterfeit-banner {
      background: #FEE2E2;
      border:     1px solid #FCA5A5;
      color:      #991B1B;
    }
  </style>
</head>
<body>

<header class="app-header">
  <h1>Supply Chain Verify</h1>
  <span class="role-badge">CONSUMER</span>
</header>

<div class="consumer-wrap">

  <div class="consumer-header">
    <h1>Verify Your Product</h1>
    <p>Scan the QR code on your product or enter the product code manually.</p>
  </div>

  <!-- ── Scanner ─────────────────────────────────────────────────────────── -->
  <div class="scan-box">
    <h2>Scan QR Code</h2>
    <div id="reader"></div>

    <div id="scanStatus" class="status"></div>

    <div style="margin: 14px 0; color: var(--gray); font-size: 13px;">— or enter code manually —</div>

    <div class="manual-lookup">
      <input type="text" id="manualCode" placeholder="e.g. SEED-BATCH-001" />
      <button class="btn btn-primary" id="lookupBtn">Look Up</button>
    </div>
  </div>

  <!-- ── Product Result ──────────────────────────────────────────────────── -->
  <div id="result" style="display:none">

    <!-- Authenticity banner -->
    <div id="authBanner" class="genuine-banner">
      <span id="authIcon">✅</span>
      <span id="authText">Product verified — genuine record found on blockchain.</span>
    </div>

    <div class="product-card">
      <div class="product-card-header">
        <span class="auth-icon" id="productIcon">📦</span>
        <div>
          <h3 id="productName">—</h3>
          <p id="productCode">—</p>
        </div>
      </div>

      <div class="product-meta">
        <div class="meta-item">
          <label>Batch Number</label>
          <span id="metaBatch">—</span>
        </div>
        <div class="meta-item">
          <label>Origin</label>
          <span id="metaOrigin">—</span>
        </div>
        <div class="meta-item">
          <label>Expiry Date</label>
          <span id="metaExpiry">—</span>
        </div>
        <div class="meta-item">
          <label>Manufacturer</label>
          <span id="metaManufacturer" style="font-family:monospace;font-size:12px">—</span>
        </div>
        <div class="meta-item">
          <label>Registered</label>
          <span id="metaRegistered">—</span>
        </div>
        <div class="meta-item">
          <label>Status</label>
          <span id="metaStatus">—</span>
        </div>
      </div>

      <div class="history-section">
        <h4>Chain of Custody</h4>
        <ul class="timeline" id="timeline">
          <li>
            <div class="tl-time">—</div>
            <div class="tl-title">Loading...</div>
          </li>
        </ul>
      </div>
    </div>

    <button class="btn btn-secondary" id="scanAgainBtn" style="width:100%">Scan Another Product</button>
  </div>

</div>

<script type="module">
import { products, formatTimestamp, shortenAddress, setStatus } from '../shared/api.js';

let scanner = null;

// ── QR Scanner ────────────────────────────────────────────────────────────────
function initScanner() {
  scanner = new Html5QrcodeScanner('reader', { fps: 10, qrbox: 250 });
  scanner.render(
    async (text) => {
      await scanner.clear();
      await lookupProduct(text.trim());
    },
    (err) => { /* ignore scan errors */ }
  );
}

// ── Lookup ────────────────────────────────────────────────────────────────────
async function lookupProduct(code) {
  if (!code) return;
  const statusEl = document.getElementById('scanStatus');
  setStatus(statusEl, `Looking up "${code}"...`, 'loading');
  document.getElementById('result').style.display = 'none';

  try {
    const { product, history } = await products.get(code);

    if (!product) {
      setStatus(statusEl, 'Product not found in the database.', 'error');
      showCounterfeit();
      return;
    }

    renderProduct(product, history || []);
    setStatus(statusEl, '', 'info');
    statusEl.style.display = 'none';
    document.getElementById('result').style.display = 'block';
  } catch (err) {
    setStatus(statusEl, `Error: ${err.message}`, 'error');
  }
}

function renderProduct(p, history) {
  const isActive = p.is_active !== false;

  // Auth banner
  const banner = document.getElementById('authBanner');
  if (!isActive) {
    banner.className = 'genuine-banner counterfeit-banner';
    document.getElementById('authIcon').textContent = '⚠️';
    document.getElementById('authText').textContent = 'This product has been flagged or recalled. Do not use.';
  } else {
    banner.className = 'genuine-banner';
    document.getElementById('authIcon').textContent = '✅';
    document.getElementById('authText').textContent = 'Product verified — genuine record found on blockchain.';
  }

  document.getElementById('productName').textContent   = p.name         || '—';
  document.getElementById('productCode').textContent   = p.product_code || '—';
  document.getElementById('metaBatch').textContent     = p.batch_number || '—';
  document.getElementById('metaOrigin').textContent    = p.origin       || '—';
  document.getElementById('metaExpiry').textContent    = p.expiry_date  || '—';
  document.getElementById('metaManufacturer').textContent = p.manufacturer_wallet
    ? shortenAddress(p.manufacturer_wallet) : '—';
  document.getElementById('metaRegistered').textContent = p.created_at
    ? new Date(p.created_at).toLocaleDateString() : '—';
  document.getElementById('metaStatus').innerHTML = isActive
    ? '<span class="badge badge-green">Active</span>'
    : '<span class="badge badge-red">Inactive</span>';

  // Timeline
  const timeline = document.getElementById('timeline');
  if (!history.length) {
    timeline.innerHTML = `<li>
      <div class="tl-time">—</div>
      <div class="tl-title">Registered by manufacturer</div>
      <div class="tl-detail">No transfers recorded yet.</div>
    </li>`;
    return;
  }

  timeline.innerHTML = history.map(e => `<li>
    <div class="tl-time">${e.timestamp ? new Date(e.timestamp * 1000).toLocaleString() : (e.recorded_at ? new Date(e.recorded_at).toLocaleString() : '—')}</div>
    <div class="tl-title">
      ${shortenAddress(e.from || e.from_addr || "")} → ${shortenAddress(e.to || e.to_addr || "")}
    </div>
    <div class="tl-detail">${e.notes || 'No notes'}</div>
    <div class="tl-hash">${e.tx_hash ? `Tx: <a href="https://sepolia.basescan.org/tx/${e.tx_hash}" target="_blank" style="color:var(--mid-blue)">${e.tx_hash.slice(0,18)}...</a>` : ''}</div>
  </li>`).join('');
}

function showCounterfeit() {
  const banner = document.getElementById('authBanner');
  banner.className = 'genuine-banner counterfeit-banner';
  document.getElementById('authIcon').textContent = '🚫';
  document.getElementById('authText').textContent = 'Product not found. This may be counterfeit.';
  document.getElementById('result').style.display = 'block';
  document.getElementById('productName').textContent = 'Unknown Product';
  document.getElementById('timeline').innerHTML = '';
}

// ── Events ────────────────────────────────────────────────────────────────────
document.getElementById('lookupBtn').addEventListener('click', () => {
  const code = document.getElementById('manualCode').value.trim();
  if (code) lookupProduct(code);
});
document.getElementById('manualCode').addEventListener('keypress', e => {
  if (e.key === 'Enter') document.getElementById('lookupBtn').click();
});
document.getElementById('scanAgainBtn').addEventListener('click', () => {
  document.getElementById('result').style.display = 'none';
  document.getElementById('manualCode').value = '';
  // Auto-lookup from URL param
const urlParams = new URLSearchParams(window.location.search);
const codeParam = urlParams.get("code");
if (codeParam) {
  document.getElementById("manualCode").value = codeParam;
  lookupProduct(codeParam);
} else {
  initScanner();
}

});

// Auto-lookup from URL param
const urlParams = new URLSearchParams(window.location.search);
const codeParam = urlParams.get("code");
if (codeParam) {
  document.getElementById("manualCode").value = codeParam;
  lookupProduct(codeParam);
} else {
  initScanner();
}

</script>
</body>
</html>
